# Render Blueprint — public demo. Render dashboard → New → Blueprint → select this repo.
# Free plan has no persistent disk: the database is re-seeded (synthetic data) on every deploy/restart.
services:
  - type: web
    name: ai-engagement-center
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AEC_PUBLIC
        value: "1"
      - key: AEC_DEMO_PASSWORD      # login password for all seeded accounts; set it yourself (≥12 chars)
        sync: false
      - key: AEC_AI_PROVIDER
        value: mock
      - key: AEC_DB_PATH
        value: /data/aec.db
      # Free instances have 512 MB RAM: use a smaller synthetic dataset (default 10k/100k)
      - key: AEC_SEED_CUSTOMERS
        value: "3000"
      - key: AEC_SEED_EVENTS
        value: "30000"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
